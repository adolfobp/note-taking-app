<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes - Sign In</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="app-icon">
          <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="48" height="48" rx="10" fill="#FFD60A"/>
            <path d="M12 14h24M12 24h20M12 34h16" stroke="#000" stroke-width="3" stroke-linecap="round"/>
          </svg>
        </div>
        <h1>Notes</h1>
        <p class="auth-subtitle" id="auth-subtitle">Sign in to your account</p>
      </div>

      <form id="auth-form" class="auth-form">
        <div class="form-group" id="username-group" style="display: none;">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="Enter username" autocomplete="username">
          <span class="error-message" id="username-error"></span>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="Enter your email" autocomplete="email" required>
          <span class="error-message" id="email-error"></span>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
          <span class="error-message" id="password-error"></span>
        </div>

        <div class="form-group" id="confirm-password-group" style="display: none;">
          <label for="confirm-password">Confirm Password</label>
          <input type="password" id="confirm-password" name="confirmPassword" placeholder="Confirm your password" autocomplete="new-password">
          <span class="error-message" id="confirm-password-error"></span>
        </div>

        <div class="form-error" id="form-error"></div>

        <button type="submit" class="btn btn-primary" id="submit-btn">Sign In</button>
      </form>

      <div class="auth-footer">
        <p id="toggle-text">
          Don't have an account?
          <a href="#" id="toggle-link">Create one</a>
        </p>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
